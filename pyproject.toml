[project]
name = "ai-portfolio-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KJ0905", email = "kapsm234@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-portfolio-chatbot = "ai_portfolio_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
